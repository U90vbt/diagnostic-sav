<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <title>Placement des antennes HF</title>
  <rect width="800" height="450" rx="18" fill="#1f1f23"/>
  <text x="40" y="52" fill="#ebedf3" font-size="20" font-weight="700">Antennes HF : garder la ligne de vue</text>
  <text x="40" y="80" fill="#b4b7c0" font-size="14">Placer les antennes en hauteur, face à la zone de jeu, sans obstacle métallique ni mur LED entre elles et l'orateur.</text>
  <!-- scène -->
  <rect x="380" y="290" width="380" height="110" rx="10" fill="#26262b" stroke="#4a4a52" stroke-width="2"/>
  <text x="690" y="388" fill="#7d808a" font-size="13" text-anchor="middle">zone de jeu / scène</text>
  <!-- orateur -->
  <circle cx="520" cy="312" r="11" fill="#a4d06f"/><path d="M520 324 v34 M506 336 h28 M520 358 l-12 22 M520 358 l12 22" stroke="#a4d06f" stroke-width="4" stroke-linecap="round" fill="none"/>
  <text x="496" y="352" fill="#a4d06f" font-size="13" text-anchor="end">émetteur</text>
  <!-- mur LED -->
  <rect x="660" y="140" width="64" height="150" rx="4" fill="#141416" stroke="#4a4a52" stroke-width="2"/>
  <text x="692" y="132" fill="#7d808a" font-size="12" text-anchor="middle">mur LED</text>
  <!-- antennes bonnes -->
  <g stroke="#56a7d5" stroke-width="4" stroke-linecap="round">
    <path d="M150 300 V160"/><path d="M150 160 l-14 -26"/><path d="M150 160 l14 -26"/>
  </g>
  <text x="134" y="236" fill="#ebedf3" font-size="13" text-anchor="end">antennes</text>
  <text x="134" y="254" fill="#ebedf3" font-size="13" text-anchor="end">en hauteur</text>
  <text x="134" y="272" fill="#b4b7c0" font-size="12" text-anchor="end">(distributeur, coax)</text>
  <path d="M168 150 L508 300" stroke="#a4d06f" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="300" y="196" fill="#a4d06f" font-size="14" font-weight="700">ligne de vue ✓</text>
  <!-- antenne mauvaise -->
  <g stroke="#ef5b52" stroke-width="4" stroke-linecap="round">
    <path d="M760 300 V236"/><path d="M760 236 l-10 -18"/><path d="M760 236 l10 -18"/>
  </g>
  <path d="M752 250 L532 316" stroke="#ef5b52" stroke-width="3" stroke-dasharray="4 6"/>
  <text x="742" y="210" fill="#ef5b52" font-size="13" text-anchor="end" font-weight="700">derrière le mur LED ✕</text>
  <!-- rack -->
  <rect x="40" y="360" width="220" height="56" rx="8" fill="#2e2e34" stroke="#4a4a52" stroke-width="2"/>
  <text x="150" y="393" fill="#b4b7c0" font-size="13" text-anchor="middle">récepteurs (rack régie)</text>
  <path d="M150 300 V360" stroke="#56a7d5" stroke-width="3"/>
</svg>
